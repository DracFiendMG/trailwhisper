# ----------------------------------------------------------------------------
# TrailWhisper Render Blueprint
# Production-Ready Multi-Service Architecture
# ----------------------------------------------------------------------------
services:
  # 1. Tabular Prediction Microservice (Python + Prior Labs TabPFN)
  - type: web
    name: trailwhisper-tabpfn
    runtime: docker
    dockerfilePath: ./services/tabpfn-service/Dockerfile
    dockerContext: ./services/tabpfn-service
    plan: standard
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: TABPFN_DEVICE
        value: cpu
      - key: TABPFN_N_ENSEMBLE
        value: 4
      - key: TABPFN_API_KEY
        sync: false

  # 2. Agent Orchestration Server (Node.js + Mastra + Sentry Tracing)
  - type: web
    name: trailwhisper-agent
    runtime: docker
    dockerfilePath: ./apps/agent-server/Dockerfile
    dockerContext: ./apps/agent-server
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: TABPFN_SERVICE_URL
        fromService:
          type: web
          name: trailwhisper-tabpfn
          property: host
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMMA_MODEL_NAME
        value: google/gemma-4-26b-a4b-it:free
      - key: GEMMA_API_BASE
        value: http://localhost:11434/v1
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: XB0fDUnXU5ikFXr333ED
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 1.0

  # 3. Pocket Client Web Application (Vite / React PWA)
  - type: web
    name: trailwhisper-web
    runtime: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_AGENT_SERVER_URL
        fromService:
          type: web
          name: trailwhisper-agent
          property: host
